name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      stage:
        required: true
        type: string
    outputs:
      url:
        description: The deployed worker URL when one is known
        value: ${{ jobs.deploy.outputs.url }}
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

jobs:
  deploy:
    name: ${{ inputs.environment }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.output.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SST_STAGE: ${{ inputs.stage }}
    outputs:
      url: ${{ steps.output.outputs.url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          package-manager-cache: false
      - name: Corepack
        run: corepack enable pnpm
      - name: Enable pnpm cache
        uses: actions/setup-node@v6
        with:
          cache: pnpm
      - name: Install
        run: pnpm i
      - name: Deploy with SST
        id: deploy
        run: pnpm run deploy
      - name: Resolve deployed URL
        id: output
        shell: bash
        run: |
          url="$(jq -r '.url // empty' .sst/outputs.json)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
